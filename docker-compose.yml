services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Apple Silicon GPU acceleration; inert elsewhere. See
      # docker-compose.nvidia.yml for the NVIDIA overlay.
      - METAL_DEVICE=on
      - METAL_DEVICE_INDEX=0
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  # FastAPI service behind the React canvas.
  backend:
    build: .
    image: ai-hedge-fund
    depends_on:
      - ollama
    env_file:
      - .env
    command: uvicorn app.backend.main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434
      - PYTHONPATH=/app
      - CORS_ALLOW_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"

  # Vite dev server for the node canvas.
  frontend:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./app/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

  hedge-fund:
    build: .
    image: ai-hedge-fund
    depends_on:
      - ollama
    env_file:
      - .env
    command: python src/main.py --ticker AAPL,MSFT,NVDA --analysts-all
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434
      - PYTHONPATH=/app
    tty: true
    stdin_open: true

  hedge-fund-reasoning:
    build: .
    image: ai-hedge-fund
    depends_on:
      - ollama
    env_file:
      - .env
    command: python src/main.py --ticker AAPL,MSFT,NVDA --analysts-all --show-reasoning
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434
      - PYTHONPATH=/app
    tty: true
    stdin_open: true

  hedge-fund-ollama:
    build: .
    image: ai-hedge-fund
    depends_on:
      - ollama
    env_file:
      - .env
    command: python src/main.py --ticker AAPL,MSFT,NVDA --analysts-all --ollama
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434
      - PYTHONPATH=/app
    tty: true
    stdin_open: true

  backtester:
    build: .
    image: ai-hedge-fund
    depends_on:
      - ollama
    env_file:
      - .env
    command: python src/backtester.py --ticker AAPL,MSFT,NVDA --analysts-all
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434
      - PYTHONPATH=/app
      # No display in a container, so the equity curve is written, not shown.
      - MPLBACKEND=Agg
    tty: true
    stdin_open: true

  backtester-ollama:
    build: .
    image: ai-hedge-fund
    depends_on:
      - ollama
    env_file:
      - .env
    command: python src/backtester.py --ticker AAPL,MSFT,NVDA --analysts-all --ollama
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434
      - PYTHONPATH=/app
      - MPLBACKEND=Agg
    tty: true
    stdin_open: true

volumes:
  ollama_data:
  frontend_node_modules:
