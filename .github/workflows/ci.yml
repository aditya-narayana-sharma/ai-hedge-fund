name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python (lint, types, tests)
    # ubuntu-latest is case-sensitive by construction. The frontend job below
    # relies on that to keep the filename-casing regression from returning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-python runs twice on purpose: `cache: poetry` needs poetry
      # already on PATH to locate the virtualenv, and pipx needs a Python.
      # This is the ordering GitHub documents for the Poetry cache.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry==1.8.3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: poetry

      # Fails loudly when poetry.lock is out of date with pyproject.toml,
      # rather than surfacing as an opaque `poetry install` error.
      - name: Check lock file
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (flake8)
        run: poetry run flake8 src app

      - name: Format check (black)
        run: poetry run black --check src app tests

      - name: Import order (isort)
        run: poetry run isort --check-only src app tests

      - name: Type check (mypy, scoped to pyproject files list)
        run: poetry run mypy

      - name: Dependency audit (pip)
        # The step always runs. It does not fail the job: the locked
        # LangChain 0.3 / FastAPI 0.104 graph has known advisories whose
        # fixes are major upgrades, which this workflow does not take.
        # Root .github/dependabot.yml is what tracks those upgrades.
        # A missing pip-audit binary still fails the step.
        run: |
          poetry run pip install --quiet pip-audit
          poetry run pip-audit || echo "pip-audit reported known advisories in the locked stack; see the log above."

      - name: Tests
        run: poetry run pytest

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Dependency audit (npm, critical)
        run: npm audit --audit-level=critical

      - name: Build
        # `tsc && vite build` — catches both the type errors and the
        # case-sensitive import resolution that broke on every non-macOS host.
        run: npm run build
