name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python (lint, types, tests)
    # ubuntu-latest is case-sensitive by construction. The frontend job below
    # relies on that to keep the filename-casing regression from returning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry==1.8.3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (flake8)
        run: poetry run flake8 src app

      - name: Format check (black)
        run: poetry run black --check src app tests

      - name: Import order (isort)
        run: poetry run isort --check-only src app tests

      - name: Type check (mypy)
        run: poetry run mypy

      - name: Tests
        run: poetry run pytest

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # `tsc && vite build` — catches both the type errors and the
        # case-sensitive import resolution that broke on every non-macOS host.
        run: npm run build
